<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banana Game - Play</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/play.html">🍌 Banana Game</a>
    <nav>
      <a href="/leaderboard.html">Leaderboard</a>
      <span id="nav-user" class="nav-user"></span>
    </nav>
  </header>

  <!-- Placeholder game screen: proves the full flow works end to end.
       Replace this with the real game once the concept is chosen. -->
  <main class="card">
    <div class="stats">
      <span>Score: <strong id="score">0</strong></span>
      <span>Solved: <strong id="solved">0</strong> / <strong id="attempted">0</strong></span>
    </div>

    <div id="puzzle-area" class="puzzle-area">
      <p id="status" class="status">Press Start to play.</p>
      <img id="puzzle-image" alt="Banana maths puzzle" hidden>
    </div>

    <form id="answer-form" class="answer-row" hidden>
      <label for="answer" class="visually-hidden">Your answer</label>
      <input id="answer" type="number" inputmode="numeric" min="0" max="99" required autocomplete="off">
      <button type="submit">Answer</button>
    </form>

    <div class="actions">
      <button id="start-btn" type="button">Start</button>
      <button id="next-btn" type="button" hidden>Next puzzle</button>
      <button id="end-btn" type="button" class="secondary" hidden>End game</button>
    </div>

    <p id="message" class="message" role="status"></p>
  </main>

  <script type="module" src="/js/play.js"></script>
</body>
</html>
