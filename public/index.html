<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banana Game - Log in</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/index.html">🍌 Banana Game</a>
    <nav><a href="/leaderboard.html">Leaderboard</a></nav>
  </header>

  <main class="card narrow">
    <div class="tabs" role="tablist">
      <button type="button" class="tab active" data-tab="login" role="tab" aria-selected="true">Log in</button>
      <button type="button" class="tab" data-tab="register" role="tab" aria-selected="false">Register</button>
    </div>

    <form id="login-form" class="tab-panel" data-panel="login" novalidate>
      <label for="login-username">Username</label>
      <input id="login-username" name="username" autocomplete="username" required>
      <label for="login-password">Password</label>
      <input id="login-password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Log in</button>
    </form>

    <form id="register-form" class="tab-panel" data-panel="register" novalidate hidden>
      <label for="register-username">Username</label>
      <input id="register-username" name="username" autocomplete="username" required
             pattern="[A-Za-z0-9_]{3,20}">
      <small>3-20 letters, numbers or _</small>
      <label for="register-password">Password</label>
      <input id="register-password" name="password" type="password" autocomplete="new-password"
             required minlength="8">
      <small>At least 8 characters</small>
      <button type="submit">Create account</button>
    </form>

    <p id="message" class="message" role="alert"></p>
  </main>

  <script type="module" src="/js/login.js"></script>
</body>
</html>
