<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banana Game - Leaderboard</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/play.html">🍌 Banana Game</a>
    <nav>
      <a href="/play.html">Play</a>
      <span id="nav-user" class="nav-user"></span>
    </nav>
  </header>

  <main class="card">
    <h1>Leaderboard</h1>
    <table class="data-table">
      <thead>
        <tr><th>#</th><th>Player</th><th>Score</th><th>Solved</th><th>Date</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <p id="message" class="message"></p>
  </main>

  <script type="module" src="/js/leaderboard.js"></script>
</body>
</html>
